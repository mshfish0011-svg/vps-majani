name: Windows Cloud RDP

on:
  workflow_dispatch:
    inputs:
      hostname:
        description: "Tailscale hostname of the server"
        required: false
        default: "github-rdp-server"
      hours:
        description: "How many hours to keep the server alive (GitHub hard limit is 6h, so max ~5.6)"
        required: false
        default: "5.5"
      idle_minutes:
        description: "Auto-stop after N minutes with nobody connected (0 = never)"
        required: false
        default: "0"
      timezone:
        description: "Windows time zone ID (empty = keep default), e.g. Iran Standard Time"
        required: false
        default: ""
      install_tools:
        description: "Install extra tools (VS Code, Notepad++, 7-Zip, VLC)"
        type: boolean
        default: true

permissions:
  contents: read

# A new run replaces the old one, so you never end up with two servers fighting over one hostname
concurrency:
  group: windows-cloud-rdp
  cancel-in-progress: true

env:
  RDP_USER: NvDAdmin
  TS_EXE: 'C:\Program Files\Tailscale\tailscale.exe'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360
    env:
      TS_HOSTNAME: ${{ inputs.hostname }}
      KEEP_HOURS: ${{ inputs.hours }}
      IDLE_MINUTES: ${{ inputs.idle_minutes }}
      TZ_ID: ${{ inputs.timezone }}

    steps:
      - name: 1. Enable Remote Desktop & Firewall
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0

          # NLA on = safer. If your RDP client has trouble connecting, set this back to 0 (the original value).
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1

          Set-Service -Name TermService -StartupType Automatic
          Start-Service -Name TermService -ErrorAction SilentlyContinue

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          # Only accept RDP from inside your Tailscale network (IPv4 + IPv6 ranges)
          Get-NetFirewallRule -DisplayGroup "Remote Desktop" |
            Set-NetFirewallRule -RemoteAddress @('100.64.0.0/10', 'fd7a:115c:a1e0::/48')

          Write-Host "Remote Desktop enabled (reachable via Tailscale only)"
          exit 0

      - name: 2. Create Admin Account
        env:
          RDP_PASSWORD_SECRET: ${{ secrets.RDP_PASSWORD }}
        run: |
          # Use the RDP_PASSWORD secret if you set one, otherwise generate a strong random password
          $plain = $env:RDP_PASSWORD_SECRET
          $source = "secret"
          if ([string]::IsNullOrWhiteSpace($plain)) {
            $bytes = New-Object byte[] 18
            [Security.Cryptography.RandomNumberGenerator]::Create().GetBytes($bytes)
            $plain = ([Convert]::ToBase64String($bytes) -replace '[+/=]', 'x') + "aA1!"
            $source = "generated"
            Write-Host "No RDP_PASSWORD secret found -> generated a random password (shown in the banner below)."
          }

          "RDP_PASS=$plain" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RDP_PASS_SOURCE=$source" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $secure = ConvertTo-SecureString $plain -AsPlainText -Force

          if (-not (Get-LocalUser -Name $env:RDP_USER -ErrorAction SilentlyContinue)) {
            New-LocalUser -Name $env:RDP_USER -Password $secure -FullName "Cloud RDP Admin" -PasswordNeverExpires -AccountNeverExpires | Out-Null
          } else {
            Set-LocalUser -Name $env:RDP_USER -Password $secure
          }

          Add-LocalGroupMember -Group "Administrators" -Member $env:RDP_USER -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $env:RDP_USER -ErrorAction SilentlyContinue

          net user runneradmin "$plain" | Out-Null

          Write-Host "Account '$($env:RDP_USER)' is ready."
          exit 0

      - name: 3. Install & Connect Tailscale VPN
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTHKEY)) {
            throw "TAILSCALE_AUTHKEY secret is missing! Add it in: Settings > Secrets and variables > Actions."
          }
          $hostname = if ([string]::IsNullOrWhiteSpace($env:TS_HOSTNAME)) { "github-rdp-server" } else { $env:TS_HOSTNAME }

          # Download Tailscale (with retries)
          $msi = Join-Path $env:RUNNER_TEMP "tailscale.msi"
          for ($i = 1; $i -le 3; $i++) {
            try {
              Invoke-WebRequest "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile $msi -UseBasicParsing
              break
            } catch {
              Write-Host "Download attempt $i failed: $_"
              if ($i -eq 3) { throw }
              Start-Sleep -Seconds 5
            }
          }

          # Install silently
          Start-Process msiexec -ArgumentList "/i `"$msi`" /quiet /norestart" -Wait

          # Wait for the Tailscale service to come up
          for ($i = 1; $i -le 15; $i++) {
            $svc = Get-Service -Name "Tailscale" -ErrorAction SilentlyContinue
            if ($svc -and $svc.Status -eq "Running") { break }
            Start-Sleep -Seconds 2
          }
          Start-Sleep -Seconds 3

          # Connect to Tailscale network
          & $env:TS_EXE up --authkey="$env:TAILSCALE_AUTHKEY" --hostname="$hostname" --unattended --accept-dns=false
          if ($LASTEXITCODE -ne 0) { throw "tailscale up failed (check that your auth key is valid and not expired)." }

          # Wait until we get a Tailscale IP
          $ts_ip = $null
          for ($i = 1; $i -le 20; $i++) {
            $ts_ip = (& $env:TS_EXE ip -4 2>$null | Select-Object -First 1)
            if ($ts_ip) { break }
            Start-Sleep -Seconds 3
          }
          if (-not $ts_ip) { throw "Tailscale did not get an IP in time." }

          # MagicDNS name (nice to have)
          $dns = ""
          try {
            $status = & $env:TS_EXE status --json | ConvertFrom-Json
            $dns = $status.Self.DNSName.TrimEnd('.')
          } catch { }

          "TS_IP=$ts_ip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TS_DNS=$dns" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $passText = if ($env:RDP_PASS_SOURCE -eq "generated") { $env:RDP_PASS } else { "(your RDP_PASSWORD secret)" }

          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "  >>> RDP SERVER IS READY! <<<" -ForegroundColor Cyan
          Write-Host "  Tailscale IP : $ts_ip" -ForegroundColor Yellow
          if ($dns) { Write-Host "  DNS name     : $dns" -ForegroundColor Yellow }
          Write-Host "  Username     : $($env:RDP_USER)" -ForegroundColor Yellow
          Write-Host "  Password     : $passText" -ForegroundColor Yellow
          Write-Host "  >> Open mstsc and connect to: $ts_ip" -ForegroundColor Magenta
          Write-Host "==================================================" -ForegroundColor Green

          # Also show the connection info on the run summary page (the password is NOT written there)
          @"
          ### 🖥️ RDP server is ready
          | | |
          |---|---|
          | **Tailscale IP** | ``$ts_ip`` |
          | **DNS name** | ``$dns`` |
          | **Username** | ``$($env:RDP_USER)`` |
          | **Password** | $(if ($env:RDP_PASS_SOURCE -eq 'generated') { 'random - see the step 3 log' } else { 'your RDP_PASSWORD secret' }) |

          Open **mstsc** and connect to ``$ts_ip``. To stop early: run **STOP-SERVER.bat** on the desktop.
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          exit 0

      - name: 4. System Info & Tuning
        run: |
          # --- Specs of this machine ---
          $cpu  = (Get-CimInstance Win32_Processor | Select-Object -First 1)
          $ram  = [math]::Round((Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory / 1GB, 1)
          $disk = Get-PSDrive C
          Write-Host "CPU  : $($cpu.Name) ($($cpu.NumberOfLogicalProcessors) logical cores)"
          Write-Host "RAM  : $ram GB"
          Write-Host "Disk : $([math]::Round($disk.Free / 1GB, 1)) GB free on C:"

          # --- Never sleep / never turn off the screen ---
          powercfg /change standby-timeout-ac 0 | Out-Null
          powercfg /change monitor-timeout-ac 0 | Out-Null
          powercfg /change hibernate-timeout-ac 0 | Out-Null

          # --- Keep your session alive even after you disconnect, no idle logoff ---
          $ts = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
          New-Item -Path $ts -Force | Out-Null
          Set-ItemProperty -Path $ts -Name "MaxIdleTime" -Value 0 -Type DWord
          Set-ItemProperty -Path $ts -Name "MaxDisconnectionTime" -Value 0 -Type DWord
          Set-ItemProperty -Path $ts -Name "MaxConnectionTime" -Value 0 -Type DWord

          # --- Audio over RDP ---
          Set-Service -Name Audiosrv -StartupType Automatic -ErrorAction SilentlyContinue
          Start-Service -Name Audiosrv -ErrorAction SilentlyContinue

          # --- Optional time zone ---
          if (-not [string]::IsNullOrWhiteSpace($env:TZ_ID)) {
            try { Set-TimeZone -Id $env:TZ_ID; Write-Host "Time zone set to: $($env:TZ_ID)" }
            catch { Write-Warning "Invalid time zone ID: $($env:TZ_ID)  (see: Get-TimeZone -ListAvailable)" }
          }

          # --- Desktop shortcut to stop the server from inside RDP ---
          Set-Content -Path "C:\Users\Public\Desktop\STOP-SERVER.bat" -Value @(
            '@echo off',
            'echo stop> C:\stop.txt',
            'echo The server will shut down within about a minute.',
            'pause'
          )
          exit 0

      - name: 5. Install Extra Tools
        if: ${{ inputs.install_tools }}
        continue-on-error: true
        run: |
          choco install vscode notepadplusplus 7zip vlc -y --no-progress
          exit 0

      - name: 6. Keep Server Alive
        run: |
          $maxMinutes = 340   # stay safely under GitHub's 360-minute job limit
          $minutes    = [math]::Min([double]::Parse($env:KEEP_HOURS, [Globalization.CultureInfo]::InvariantCulture) * 60, $maxMinutes)
          $deadline   = (Get-Date).AddMinutes($minutes)
          $idleLimit  = [int]$env:IDLE_MINUTES
          $lastActive = Get-Date

          Write-Host ""
          Write-Host "  >> Server stays up for ~$([int]$minutes) minutes." -ForegroundColor Cyan
          Write-Host "  >> Connect to: $($env:TS_IP)  |  user: $($env:RDP_USER)" -ForegroundColor Magenta
          Write-Host "  >> Stop early: run STOP-SERVER.bat on the desktop (or create C:\stop.txt)" -ForegroundColor Magenta
          Write-Host ""

          $i = 0
          while ((Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 60
            $i++

            # Stop requested from inside the RDP session
            if (Test-Path "C:\stop.txt") {
              Write-Host "Stop file found -> shutting down."
              break
            }

            # Is anybody connected over RDP right now?
            $connected = @(Get-NetTCPConnection -LocalPort 3389 -State Established -ErrorAction SilentlyContinue).Count -gt 0
            if ($connected) { $lastActive = Get-Date }

            # Optional idle auto-stop (saves Actions minutes)
            if ($idleLimit -gt 0 -and ((Get-Date) - $lastActive).TotalMinutes -ge $idleLimit) {
              Write-Host "Nobody connected for $idleLimit minutes -> shutting down."
              break
            }

            # Tailscale health check every 5 minutes
            if ($i % 5 -eq 0) {
              & $env:TS_EXE status *> $null
              if ($LASTEXITCODE -ne 0) {
                Write-Warning "Tailscale looks down, restarting the service..."
                Restart-Service -Name "Tailscale" -ErrorAction SilentlyContinue
              }
              $global:LASTEXITCODE = 0
            }

            $left  = [int]($deadline - (Get-Date)).TotalMinutes
            $state = if ($connected) { "connected" } else { "nobody connected" }
            Write-Host "[$i] Server running... | RDP: $state | ~$left min left"
          }
          exit 0

      - name: 7. Cleanup
        if: always()
        run: |
          # Remove this machine from your tailnet so no ghost device is left behind
          if (Test-Path $env:TS_EXE) { & $env:TS_EXE logout }
          exit 0
