name: VLESS Cloudflare Fixed (Working Ping + YouTube & Telegram)
on:
  workflow_dispatch:
    inputs:
      hours:
        description: "How many hours to keep the tunnel alive (max ~5.6)"
        required: false
        default: "5"
      remark:
        description: "Name of the config in your client app (no spaces)"
        required: false
        default: "GitHub"

permissions:
  contents: read

concurrency:
  group: vless-fixed-tunnel
  cancel-in-progress: true

jobs:
  tunnel:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      HOURS: ${{ inputs.hours }}
      REMARK: ${{ inputs.remark }}
      PORT_WS: "10809"
      WS_PATH: "/vless"
      TEST_URL_SMALL: "https://www.google.com/generate_204"
      TEST_URL_BIG: "https://speed.cloudflare.com/__down?bytes=25000000"

    steps:
      - name: 1. Install Xray & Cloudflared
        run: |
          set -e
          mkdir -p "$HOME/bin" && cd "$HOME/bin"
          curl -fsSL --retry 3 -o xray.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip -qo xray.zip
          curl -fsSL --retry 3 -o cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x xray cloudflared
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: 2. Network Tuning (BBR)
        continue-on-error: true
        run: |
          sudo modprobe tcp_bbr 2>/dev/null || true
          sudo sysctl -w net.core.default_qdisc=fq || true
          sudo sysctl -w net.ipv4.tcp_congestion_control=bbr || true
          sudo sysctl -w net.core.rmem_max=16777216 net.core.wmem_max=16777216 || true
          exit 0

      - name: 3. Configure Xray Server (FakeDNS & IPv4 Fix)
        run: |
          set -e
          UUID=$(cat /proc/sys/kernel/random/uuid)
          echo "UUID=$UUID" >> "$GITHUB_ENV"

          # CRITICAL FIX: routeOnly MUST be false so FakeDNS from client apps opens YouTube/Telegram!
          cat > "$HOME/xray.json" <<EOF
          {
            "log": { "loglevel": "warning" },
            "dns": {
              "servers": ["1.1.1.1", "8.8.8.8"],
              "queryStrategy": "UseIPv4"
            },
            "inbounds": [
              {
                "tag": "in-ws",
                "listen": "127.0.0.1",
                "port": $PORT_WS,
                "protocol": "vless",
                "settings": {
                  "clients": [{ "id": "$UUID" }],
                  "decryption": "none"
                },
                "streamSettings": {
                  "network": "ws",
                  "security": "none",
                  "wsSettings": { "path": "$WS_PATH" }
                },
                "sniffing": {
                  "enabled": true,
                  "destOverride": ["http", "tls", "quic"],
                  "routeOnly": false
                }
              }
            ],
            "outbounds": [
              {
                "protocol": "freedom",
                "tag": "direct",
                "settings": { "domainStrategy": "UseIPv4" }
              },
              {
                "protocol": "blackhole",
                "tag": "block"
              }
            ],
            "routing": {
              "domainStrategy": "IPIfNonMatch",
              "rules": [
                {
                  "type": "field",
                  "protocol": ["bittorrent"],
                  "outboundTag": "block"
                }
              ]
            }
          }
          EOF
          xray run -test -config "$HOME/xray.json"

      - name: 4. Start Tunnel & Print Working Configs
        run: |
          set +e
          ulimit -n 65535 2>/dev/null
          CF_LOG="$HOME/cf.log"
          XRAY_PID=""; CF_PID=""; CF_DOMAIN=""

          start_xray() {
            setsid nohup xray run -config "$HOME/xray.json" > "$HOME/xray.log" 2>&1 &
            XRAY_PID=$!
          }

          start_cf() {
            : > "$CF_LOG"
            setsid nohup cloudflared tunnel --url "http://127.0.0.1:$PORT_WS" --no-autoupdate --edge-ip-version 4 --protocol http2 > "$CF_LOG" 2>&1 &
            CF_PID=$!
            for _ in $(seq 1 30); do
              D=$(grep -oE 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' "$CF_LOG" | head -1 | sed 's#https://##')
              if [ -n "$D" ]; then CF_DOMAIN="$D"; return 0; fi
              kill -0 "$CF_PID" 2>/dev/null || return 1
              sleep 1
            done
            kill "$CF_PID" 2>/dev/null
            return 1
          }

          announce() {
            ENC_PATH=$(echo "$WS_PATH" | sed 's#/#%2F#g')
            
            # Fragment 10-25 bytes slices "trycloudflare.com" (17 chars) in half, 2-4ms delay keeps it fast!
            # ALPN is strictly http/1.1 (Required for Cloudflare WebSocket)
            LINK_1="vless://${UUID}@www.speedtest.net:443?encryption=none&security=tls&sni=${CF_DOMAIN}&fp=chrome&alpn=http%2F1.1&type=ws&host=${CF_DOMAIN}&path=${ENC_PATH}&fragment=10-25,2-4,tlshello#${REMARK}-Frag-Speedtest"
            LINK_2="vless://${UUID}@162.159.135.42:443?encryption=none&security=tls&sni=${CF_DOMAIN}&fp=chrome&alpn=http%2F1.1&type=ws&host=${CF_DOMAIN}&path=${ENC_PATH}&fragment=10-25,2-4,tlshello#${REMARK}-Frag-IP1"
            LINK_3="vless://${UUID}@104.18.2.161:443?encryption=none&security=tls&sni=${CF_DOMAIN}&fp=chrome&alpn=http%2F1.1&type=ws&host=${CF_DOMAIN}&path=${ENC_PATH}&fragment=10-25,2-4,tlshello#${REMARK}-Frag-IP2"

            cat > "$HOME/client-fixed.json" <<EOF
          {
            "remarks": "${REMARK}-JSON-Fixed",
            "log": { "loglevel": "warning" },
            "dns": {
              "servers": ["1.1.1.1", "8.8.8.8"],
              "queryStrategy": "UseIPv4"
            },
            "inbounds": [
              {
                "tag": "socks",
                "port": 10808,
                "listen": "127.0.0.1",
                "protocol": "socks",
                "sniffing": { "enabled": true, "destOverride": ["http", "tls"], "routeOnly": false },
                "settings": { "auth": "noauth", "udp": true }
              },
              {
                "tag": "http",
                "port": 10809,
                "listen": "127.0.0.1",
                "protocol": "http",
                "sniffing": { "enabled": true, "destOverride": ["http", "tls"], "routeOnly": false }
              }
            ],
            "outbounds": [
              {
                "tag": "proxy",
                "protocol": "vless",
                "settings": {
                  "vnext": [
                    {
                      "address": "www.speedtest.net",
                      "port": 443,
                      "users": [
                        { "id": "${UUID}", "encryption": "none" }
                      ]
                    }
                  ]
                },
                "streamSettings": {
                  "network": "ws",
                  "security": "tls",
                  "tlsSettings": {
                    "serverName": "${CF_DOMAIN}",
                    "alpn": ["http/1.1"],
                    "fingerprint": "chrome"
                  },
                  "wsSettings": {
                    "path": "${WS_PATH}",
                    "headers": { "Host": "${CF_DOMAIN}" }
                  },
                  "sockopt": {
                    "dialerProxy": "fragment",
                    "tcpKeepAliveIdle": 100,
                    "tcpNoDelay": true
                  }
                },
                "mux": {
                  "enabled": true,
                  "concurrency": 8,
                  "xudpConcurrency": 8,
                  "xudpProxyUDP443": "reject"
                }
              },
              {
                "tag": "fragment",
                "protocol": "freedom",
                "settings": {
                  "domainStrategy": "AsIs",
                  "fragment": {
                    "packets": "tlshello",
                    "length": "10-25",
                    "interval": "2-4"
                  }
                }
              },
              { "tag": "direct", "protocol": "freedom" },
              { "tag": "block", "protocol": "blackhole" }
            ],
            "routing": {
              "domainStrategy": "IPIfNonMatch",
              "rules": [
                { "type": "field", "network": "udp", "port": "443", "outboundTag": "block" },
                { "type": "field", "ip": ["geoip:private"], "outboundTag": "direct" }
              ]
            }
          }
          EOF

            echo ""
            echo "=================================================================="
            echo "  >>> 🚀 FIXED CONFIGS ARE READY! <<<"
            echo ""
            echo "  [1] Fragment + Speedtest (The one that gave you good ping, now fixed!):"
            echo "$LINK_1"
            echo ""
            echo "  [2] Fragment + Clean IP 1 (162.159.135.42):"
            echo "$LINK_2"
            echo ""
            echo "  [3] Fragment + Clean IP 2 (104.18.2.161):"
            echo "$LINK_3"
            echo "=================================================================="

            {
              echo "### 🔗 ۱. لینک‌های آماده با فرگمنت اصلاح‌شده (کپی و ایمپورت کنید)"
              echo "هر ۳ لینک زیر را در برنامه خود وارد کنید و از هر کدام که پینگ بهتری داد استفاده کنید:"
              echo '```'
              echo "$LINK_1"
              echo "$LINK_2"
              echo "$LINK_3"
              echo '```'
              echo "---"
              echo "### 🚀 ۲. کانفیگ کامل JSON (شامل فرگمنت `10-25` + Mux داخلی)"
              echo "اگر از **v2rayNG / MahsaNG / v2rayN** استفاده می‌کنید، کل کد زیر را کپی و از کلیپ‌بورد ایمپورت کنید:"
              echo '```json'
              cat "$HOME/client-fixed.json"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          }

          speed_test() {
            echo ""
            echo "=================== SPEED TEST ==================="
            sleep 5
            xray run -config "$HOME/client-fixed.json" >/dev/null 2>&1 &
            local PID_T=$!
            sleep 3
            local T SPEED
            T=$(curl -s -o /dev/null --max-time 15 -x "socks5h://127.0.0.1:10808" -w '%{time_total}' "$TEST_URL_SMALL")
            SPEED=$(curl -sL -o /dev/null --max-time 15 -x "socks5h://127.0.0.1:10808" -w '%{speed_download}' "$TEST_URL_BIG")
            printf '  Tunnel Self-Test -> latency: %s s | download: %s Mbps\n' "$T" "$(awk -v s="${SPEED:-0}" 'BEGIN { printf "%.1f", s * 8 / 1000000 }')"
            kill "$PID_T" 2>/dev/null; wait "$PID_T" 2>/dev/null
            echo "==================================================="
          }

          start_xray
          sleep 2
          for _ in 1 2 3; do start_cf && break; sleep 3; done
          if [ -z "$CF_DOMAIN" ]; then echo "Failed to start Cloudflare tunnel."; exit 1; fi

          announce
          speed_test

          MINUTES=$(awk -v h="$HOURS" 'BEGIN { m = h * 60; if (m > 340) m = 340; printf "%d", m }')
          END=$(( $(date +%s) + MINUTES * 60 ))
          TICK=0
          while [ "$(date +%s)" -lt "$END" ]; do
            sleep 10
            TICK=$((TICK + 1))
            if ! kill -0 "$XRAY_PID" 2>/dev/null; then start_xray; fi
            if ! kill -0 "$CF_PID" 2>/dev/null; then
              if start_cf; then announce; fi
            fi
            if [ $((TICK % 6)) -eq 0 ]; then
              echo "[$((TICK / 6))] Running... ~$(( (END - $(date +%s)) / 60 )) min left"
            fi
          done
          exit 0
